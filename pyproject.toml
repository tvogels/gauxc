[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "gauxc"
version = "1.0.0"
description = "Python bindings for GauXC - GPU-accelerated exchange-correlation library"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "GauXC Developers"}
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
torch = ["torch>=1.9.0"]
dev = ["pytest>=6.0", "torch>=1.9.0"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.verbose = true
minimum-version = "0.3"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
GAUXC_ENABLE_PYTHON = "ON"
GAUXC_ENABLE_TESTS = "OFF"
GAUXC_ENABLE_MPI = "OFF"
